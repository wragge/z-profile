<!DOCTYPE html>
<html prefix="og: https://ogp.me/ns#  zotero: http://www.zotero.org/namespaces/export#" >
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ get_url(path='css/bulma.min.css')}}">
    <link rel="stylesheet" href="{{ get_url(path='css/style.css')}}">
    <link href="{{ get_url(path='css/fontawesome.min.css')}}" rel="stylesheet" />
    <link href="{{ get_url(path='css/brands.min.css') }}" rel="stylesheet" />
    <link href="{{ get_url(path='css/solid.min.css') }}" rel="stylesheet" />
    <link href="{{ get_url(path='css/regular.min.css') }}" rel="stylesheet" />
    {% block meta %} {% endblock meta %}
  </head>
  <body>
  <section class="section">
    <div class="container">
      {% block content %} {% endblock content %}
    </div>
  </section>
  <footer class="footer">
  <div class="content has-text-centered is-size-7">
    <p>
      Created using <a href="https://github.com/wragge/z-profile">z-profile</a>.
    </p>
  </div>
</footer>
  </body>
</html>
